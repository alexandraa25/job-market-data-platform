x-azure-environment: &azure-environment
  AZURE_PROCESSED_CONTAINER: ${AZURE_PROCESSED_CONTAINER:-processed}
  AZURE_UPLOAD_ENABLED: ${AZURE_UPLOAD_ENABLED:-false}
  AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
  AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-raw}
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
  AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}

x-airflow-environment: &airflow-environment
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:airflow@airflow-db:5432/airflow
  MAX_REJECTED_PERCENT: ${MAX_REJECTED_PERCENT:-10}
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  # Use the worker IP reachable by the API server on the Compose network.
  AIRFLOW__CORE__HOSTNAME_CALLABLE: airflow.utils.net.get_host_ip_address
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in .env}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?Set AIRFLOW_API_SECRET_KEY in .env}
  AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
  AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT: 8793

services:

  db:
    image: postgres:18

    environment:
      POSTGRES_DB: job_market_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./sql/analytics_views.sql:/docker-entrypoint-initdb.d/z_analytics_views.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d job_market_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  etl:
    build:
      context: .

    environment:
      <<: *azure-environment
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: job_market_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  spark:
    profiles: [spark]
    build:
      context: .
      dockerfile: Dockerfile.spark
    environment:
      <<: *azure-environment
      AZURE_PROCESSED_CONTAINER: ${AZURE_PROCESSED_CONTAINER:-processed}
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./data:/app/data

  airflow-db:
    image: postgres:18

    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U airflow -d airflow"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    depends_on:
      airflow-db:
        condition: service_healthy

    environment:
      <<: *airflow-environment

    command:
      - bash
      - -c
      - |
        airflow db migrate

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./data:/opt/airflow/project/data
      - ./logs:/opt/airflow/project/logs
      - ./logs/airflow:/opt/airflow/logs

  airflow-api-server:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

    environment:
      <<: *airflow-environment

      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: job_market_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}

    command: api-server
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    ports:
      - "8080:8080"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./data:/opt/airflow/project/data
      - ./logs:/opt/airflow/project/logs
      - ./logs/airflow:/opt/airflow/logs

  airflow-scheduler:
    hostname: airflow-scheduler
    build:
      context: .
      dockerfile: Dockerfile.airflow

    depends_on:
      airflow-api-server:
        condition: service_healthy
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

    environment:
      <<: [*airflow-environment, *azure-environment]

      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: job_market_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}

    command: scheduler

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./data:/opt/airflow/project/data
      - ./logs:/opt/airflow/project/logs
      - ./logs/airflow:/opt/airflow/logs

  airflow-dag-processor:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    environment:
      <<: *airflow-environment

    command: dag-processor

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./data:/opt/airflow/project/data
      - ./logs:/opt/airflow/project/logs
      - ./logs/airflow:/opt/airflow/logs

volumes:
  postgres_data:
  airflow_postgres_data:
