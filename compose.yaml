services:

  db:
    image: postgres:18

    environment:
      POSTGRES_DB: job_market_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d job_market_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  etl:
    build:
      context: .

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: job_market_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs


volumes:
  postgres_data: