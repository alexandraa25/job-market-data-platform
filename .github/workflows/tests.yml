name: Run Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: job_market_test
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tester -d job_market_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AZURE_UPLOAD_ENABLED: "false"
      SPARK_LOCAL_IP: "127.0.0.1"
      TEST_DATABASE_URL: postgresql+psycopg://tester:test-only-password@localhost:5432/job_market_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java for PySpark
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements.spark.txt

      - name: Verify database bootstrap and repeatable upgrade
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: job_market_test
          PGUSER: tester
          PGPASSWORD: test-only-password
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql -X -v ON_ERROR_STOP=1 -f sql/init.sql
          psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO jobs(guid,title,application_link) VALUES ('bootstrap-legacy','Legacy job','https://example.com/legacy')"
          sh sql/migrate.sh
          sh sql/migrate.sh
          psql -X -v ON_ERROR_STOP=1 -f tests/database_bootstrap_validation.sql

      - name: Run tests
        run: |
          python -m pytest -v
